package: hydrafetch
generate:
  models: true
output: generated.go
output-options:
  skip-prune: true
  exclude-schemas:
    - CreateMonitorDto
    - UpdateMonitorDto
    - MonitorResponseDto
    - MonitorEnvelopeDto
    - MonitorListDto
    - MonitorChangeDto
    - MonitorCheckResponseDto
    - MonitorCheckEnvelopeDto
  exclude-tags:
    - Monitors
  name-normalizer: ToCamelCaseWithInitialisms
  type-mapping:
    string:
      formats:
        uuid:
          type: string
